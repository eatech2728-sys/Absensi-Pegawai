name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Jalankan otomatis setiap Anda push ke branch main

permissions:
  contents: write # PENTING: Memberikan izin akses untuk mengunggah hasil build

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Sesuaikan dengan versi Node yang Anda gunakan

      - name: Install Dependencies
        run: npm install --frozen-lockfile || npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Folder hasil build Vite (biasanya 'dist' atau 'build')
          branch: gh-pages # Hasil akhir akan dikirim ke branch gh-pages
