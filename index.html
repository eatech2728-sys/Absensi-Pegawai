<!doctype html>
<html lang="id">
  <head>
    <script>
      // Filter out benign Vite HMR reconnection warnings in containerized sandboxes
      (function() {
        const originalError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => (typeof a === 'object' && a?.message ? a.message : String(a))).join(' ');
          if (msg.includes('send was called before connect') || msg.includes('failed to connect to websocket')) {
            return;
          }
          originalError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event?.reason;
          const msg = reason?.message || String(reason || '');
          if (msg.includes('send was called before connect') || msg.includes('failed to connect to websocket')) {
            event.preventDefault();
          }
        });
      })();

      // Real-time detection of system theme preferences (prefers-color-scheme: dark)
      (function() {
        try {
          const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          const mode = localStorage.getItem('absensi_theme_mode') || 'system';

          function updateTheme(isDark) {
            if (isDark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#0f172a' : '#2563eb');
          }

          if (mode === 'dark') {
            updateTheme(true);
          } else if (mode === 'light') {
            updateTheme(false);
          } else {
            updateTheme(mediaQuery.matches);
          }

          function onSystemThemeChange(e) {
            const currentMode = localStorage.getItem('absensi_theme_mode') || 'system';
            if (currentMode === 'system') {
              updateTheme(e.matches);
              window.dispatchEvent(new CustomEvent('system-theme-change', { detail: { isDark: e.matches } }));
            }
          }

          if (mediaQuery.addEventListener) {
            mediaQuery.addEventListener('change', onSystemThemeChange);
          } else if (mediaQuery.addListener) {
            mediaQuery.addListener(onSystemThemeChange);
          }
        } catch (err) {
          console.warn('System theme detection error:', err);
        }
      })();
    </script>
